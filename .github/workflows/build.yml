name: Build APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. multiple pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The release job opts into "contents: write".
permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsu-sideloader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Assemble release APK (tags)
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Optional signing secrets. When they are absent the job still builds an
      # unsigned release APK, which is attached to the GitHub Release.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The app already reads ".sign/dsu_sideloader.prop" for release signing
      # (see app/build.gradle.kts). We materialize that file from secrets here,
      # so no signing information is ever committed to the repository.
      - name: Configure release signing from secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p .sign
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .sign/ci-keystore.jks
          {
            echo "keystore=$PWD/.sign/ci-keystore.jks"
            echo "keystore_pw=$KEYSTORE_PASSWORD"
            echo "alias=$KEY_ALIAS"
            echo "alias_pw=$KEY_PASSWORD"
          } > .sign/dsu_sideloader.prop

      - name: Assemble release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsu-sideloader-release-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Automated release build for $tag." --verify-tag
          fi
          gh release upload "$tag" artifacts/*.apk --clobber
